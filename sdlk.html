<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardField - Network Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #ff6600;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
        }
        input {
            background: #ffff;
            color: #ff4000;
            border: #000;
            border-radius: 5px;
        }
        button {
            background: #ff4000;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        .results {
            margin-top: 20px;
            text-align: left;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            color: #ff6600;
        }
        img { max-width: 300px; height: auto; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>GuardField </h1>
    <img source = "/images/cat.jpg" alt = "GuardField Cat" style = "width:500px;height:600px;">
    

    <div class="container">
        <form method="POST">
            <label for="user_input">Add the IP addresses of your smart home devices:</label>
            <input type="text" id="user_input" name="user_input" required>
            <button type="submit">Find Vulnerabilities</button>
        </form>
    </div>

    <!--
    {% if output %}
    <h2>Output:</h2>
    <pre>{{ output }}</pre>
    {% endif %}
    -->
    
</body>
</html>
